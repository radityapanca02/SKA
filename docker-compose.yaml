version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ska-app:latest
    container_name: skariga_app
    network_mode: "host"
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage

  webserver:
    image: nginx:alpine
    container_name: skariga_webserver
    network_mode: "host"
    restart: always
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./.env:/var/www/.env
    depends_on:
      - app

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: skariga_tunnel
    network_mode: "host"
    restart: always
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
