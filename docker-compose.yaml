services:
  # Container PHP 8.4
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ska-app
    restart: unless-stopped
    volumes:
      - ./:/var/www
    networks:
      - ska-network

  # Container Nginx (Web Server)
  nginx:
    image: nginx:alpine
    container_name: ska-nginx
    restart: unless-stopped
    ports:
      - "8080:80" # change the ip
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ska-network

networks:
  ska-network:
    driver: bridge
